name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: PYTHONPATH=. pytest -q
      - name: Verify offline v1 loop
        run: python scripts/verify_v1.py
      - name: Verify App Store metadata
        run: python scripts/verify_app_store_metadata.py
