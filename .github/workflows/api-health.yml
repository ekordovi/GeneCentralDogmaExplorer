name: API Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

jobs:
  api-health:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.GENE_DOGMA_API_BASE_URL }}
      HEALTH_URL: ${{ vars.GENE_DOGMA_API_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve configured API base URL
        id: api
        run: |
          if [ -n "$API_BASE_URL" ]; then
            echo "base_url=${API_BASE_URL%/}" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$HEALTH_URL" ]; then
            case "$HEALTH_URL" in
              */api/health)
                echo "base_url=${HEALTH_URL%/api/health}" >> "$GITHUB_OUTPUT"
                echo "configured=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                echo "::error title=Invalid API health URL::GENE_DOGMA_API_HEALTH_URL must end with /api/health or set GENE_DOGMA_API_BASE_URL instead."
                exit 1
                ;;
            esac
          fi

          echo "::notice title=API health check skipped::Set GENE_DOGMA_API_BASE_URL to your deployed API base URL, or set GENE_DOGMA_API_HEALTH_URL to your deployed /api/health URL."
          echo "configured=false" >> "$GITHUB_OUTPUT"
      - name: Verify deployed API contract
        if: steps.api.outputs.configured == 'true'
        run: |
          python scripts/verify_v1.py --base-url "${{ steps.api.outputs.base_url }}"
