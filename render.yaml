services:
  - type: web
    name: gene-central-dogma-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GENE_DOGMA_API_ENV
        value: production
      - key: GENE_DOGMA_API_VERSION
        value: "1.0.0"
